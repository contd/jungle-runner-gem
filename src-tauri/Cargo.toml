[package]
name = "jungle-run"
version = "1.1.2"
description = "Jungle Run - Modern Retro Adventure Game"
authors = ["Jungle Run Team"]
edition = "2021"

[lib]
name = "jungle_run_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
