name: Test, build all platforms, and publish docs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: tests-${{ matrix.os }}
      - name: Install Linux Tauri and headless test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: bun install --frozen-lockfile
      - run: npm run version:check
      - run: npm run lint
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      # generate_context! in native IPC tests needs real frontend assets.
      - name: Prepare assets for native test context
        run: npm run build
      - name: Rust tests
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets
          else
            cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets
          fi
      - name: Rust tests with Windows harness manifest
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: pwsh -NoProfile -File ${{ github.workspace }}/tools/run-windows-tests.ps1
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets
          exit $LASTEXITCODE
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  desktop:
    name: Build desktop (${{ matrix.platform }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows
            os: windows-latest
            bundles: nsis
          - platform: macos
            os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: desktop-${{ matrix.platform }}
      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - run: bun install --frozen-lockfile
      - run: npm run version:check
      - name: Build unsigned desktop packages
        run: npm run tauri -- build --ci --no-sign --bundles "${{ matrix.bundles }}" -- --locked
      - name: Preserve macOS app permissions and symlinks
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Jungle Run.app" macos-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jungle-run-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            macos-app.zip

  ios:
    name: Build iOS simulator (unsigned ARM64)
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-simulator
      - name: Install Xcode project generator
        run: brew install xcodegen
      - run: bun install --frozen-lockfile
      - run: npm run version:check
      - name: Generate iOS project from current Tauri configuration
        run: npm run tauri -- ios init --ci --skip-targets-install
      - name: Build without Apple signing credentials
        run: npm run tauri -- ios build --ci --target aarch64-sim --no-sign -- --locked
      - name: Package simulator app
        run: |
          APP_PATH=$(find src-tauri/gen/apple/build -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jungle-run-ios-simulator
          path: ios-simulator.zip
          if-no-files-found: error

  android:
    name: Build Android debug APK (ARM64)
    needs: tests
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # Override the action's retired "tools platform-tools" default.
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64
      - name: Install pinned Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: npm run version:check
      - name: Generate Android project from current Tauri configuration
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build debug APK with the generated debug keystore
        run: npm run tauri -- android build --ci --debug --target aarch64 --apk -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: jungle-run-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  docs:
    name: Generate and verify documentation
    needs: tests
    runs-on: macos-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install application dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated documentation dependencies
        run: npm run docs:install
      - name: Build frontend assets for Tauri's generated context
        run: npm run build
      - name: Generate and verify TypeDoc and rustdoc
        run: npm run docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [desktop, ios, android, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
